services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fin_research
      POSTGRES_PASSWORD: fin_research
      POSTGRES_DB: fin_research
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_research"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fin_research:fin_research@postgres:5432/fin_research
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
